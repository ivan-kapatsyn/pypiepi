<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='login.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function () {
            $('#username-field').on('input', function () {
                let query = $(this).val();
                if (query.length > 0) {
                    $.ajax({
                        url: '/login/get_suggestions',
                        method: 'GET',
                        data: { query: query },
                        success: function (data) {
                            let suggestionsBox = $('#suggestions');
                            suggestionsBox.empty();
                            data.forEach(function (suggestion) {
                                suggestionsBox.append(
                                    `<div class="suggestion-item" data-username="${suggestion.username}" data-user-id="${suggestion.user_id}">${suggestion.username}</div>`
                                );
                            });
                            suggestionsBox.show();
                        }
                    });
                } else {
                    $('#suggestions').empty().hide();
                }
            });

            $(document).on('click', '#suggestions div', function () {
                $('#username-field').val($(this).text());
                $('#suggestions').empty().hide();
            });

            $(document).click(function (event) {
                if (!$(event.target).closest('#username-field, #suggestions').length) {
                    $('#suggestions').empty().hide();
                }
            });
        });

        $(document).on('click', '.suggestion-item', function () {
            let username = $(this).data('username');
            let userId = $(this).data('user-id');
            $('#username-field').val(username);
            $('#suggestions').empty().hide();

            // Send suggestion to the backend
            $.ajax({
                url: '/login/process_suggestion',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ username: username, user_id: userId }),
                success: function (response) {
                    if (response.redirect) {
                        window.location.href = response.redirect; // Perform the redirect
                    }
                },
                error: function (error) {
                    console.error('Error processing suggestion:', error);
                }
            });
        });
    </script>
</head>

<body>

    <div class="header">
        <h1>TutorMe</h1>
       <!-- <img src="pypiepi/html/css/banner.png" class="header-image" alt="TutorMe"> --> <!-- ???????? -->
    </div>

    <div class="login-container">
        <h1>Login</h1>
        <form method="POST">
            {{ form.hidden_tag() }}
            <div>
                {{ form.username.label }}<br>
                {{ form.username(size=20, id="username-field") }}
                <div id="suggestions"></div>
            </div>
            <div>
                {{ form.password.label }}<br>
                {{ form.password(size=32) }}
            </div>
            <div>
                <!-- Hinzufügen der Klasse 'login-button' für den Login-Button -->
                {{ form.submit(class="login-button") }}
            </div>
        </form>

        <form method="POST">
            <div>
                <!-- Hinzufügen der Klasse 'register-button' für den Registrierungs-Button -->
                {{ form.register_new_user(class="register-button") }}
            </div>
        </form>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <title>Login</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script>
        $(document).ready(function () {
            $('#username-field').on('input', function () {
                let query = $(this).val();
                if (query.length > 0) {
                    $.ajax({
                        url: 'http://127.0.0.1:5000/get_suggestions',
                        method: 'GET',
                        data: { query: query },
                        success: function (data) {
                            let suggestionsBox = $('#suggestions');
                            suggestionsBox.empty();
                            data.forEach(function (suggestion) {
                                suggestionsBox.append(`<div>${suggestion}</div>`);
                            });
                            suggestionsBox.show();
                        }
                    });
                } else {
                    $('#suggestions').empty().hide();
                }
            });

            $(document).on('click', '#suggestions div', function () {
                $('#username-field').val($(this).text());
                $('#suggestions').empty().hide();
            });

            $(document).click(function (event) {
                if (!$(event.target).closest('#username-field, #suggestions').length) {
                    $('#suggestions').empty().hide();
                }
            });
        });
    </script>
</head>
<body>

    <h1>Login</h1>
    <form method="POST">
        {{ form.hidden_tag() }}
        <div>
            {{ form.username.label }}<br>
             {{ form.username(size=20, id="username-field") }}
            <div id="suggestions"></div>
        </div>
        <div>
            {{ form.password.label }}<br>
            {{ form.password(size=32) }}
        </div>
        <div>
            {{ form.submit() }}
        </div>
    </form>
</body>
</html>

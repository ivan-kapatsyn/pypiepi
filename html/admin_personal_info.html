<!DOCTYPE html>
<html lang="en">
<head>
    <title>Admin's working page</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='tutor_personal_info.css') }}">
    <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}" type="image/x-icon">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/js/bootstrap.bundle.min.js" defer></script>
    <script>
        $(document).ready(function () {
            // Attach click event to rememberCheckbox
            $('#rememberCheckbox').on('change', function () {
                const isChecked = $(this).is(':checked'); // Check if the checkbox is checked
                const userId = '{{ user_id }}'; // Replace with dynamic user ID if available

                // AJAX request
                $.ajax({
                    url: `/user/${userId}/toggle_remember_me`,
                    type: 'POST',
                    contentType: 'application/json',
                    data: JSON.stringify({remember_me: isChecked}),
                    success: function (response) {
                        console.log('Remember me toggled:', response);
                    },
                    error: function (xhr, status, error) {
                        console.error('Error toggling remember me:', status, error);
                    }
                });
            });
        });
    </script>
    <script>
        const logoutButton = document.querySelector('.logout');

        logoutButton.addEventListener('click', (event) => {
            event.preventDefault();
            alert('Redirecting to login page...');
            window.location.href = 'login.html';
        });
    </script>
    <script>
        function enableEdit(name) {
            const container = document.getElementById('data-container');
            const nameSpan = document.getElementById('data-' + name);
            const editButton = document.getElementById('edit-button-' + name);

            // Replace name with an input field
            const currentValue = nameSpan.innerText;
            nameSpan.innerHTML = `<input id="edit-input" value="${currentValue}" style="width: 70%;">`;

            // Replace "Edit" button with "Ok" and "Cancel"
            editButton.outerHTML = `
            <button id="ok-button" onclick="saveData('${name}')">Ok</button>
            <button id="cancel-button" onclick="cancelEdit('${currentValue}', '${name}')">Cancel</button>
        `;
        }

        function saveData(name) {
            const newValue = document.getElementById('edit-input').value;
            // Call the Flask endpoint with the new data
            fetch('/tutor/{{ user_id }}/update-data', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({info_to_update: {[name]: newValue}}),
            })
                .then(response => {
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }

                    if (response.status === 204) {
                        return {'success': true}; // Handle empty responses
                    }

                    return response.json(); // Otherwise, parse JSON
                })
                .then(data => {
                    if (data.success) {
                        // Update the UI
                        document.getElementById('data-' + name).innerText = newValue;
                        resetButtons();
                    } else {
                        alert('Failed to update data!');
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    alert('Failed to update data!');
                });
        }

        function cancelEdit(originalValue, name) {
            // Restore the original value and reset the UI
            document.getElementById('data-' + name).innerText = originalValue;
            resetButtons(name);
        }

        function resetButtons(name) {
            // Replace "Ok" and "Cancel" with the "Edit" button
            const container = document.getElementById('data-container');
            const editButtonHtml = `<button id="edit-button-${name}" onclick="enableEdit('${name}')">Edit</button>`;
            container.querySelector('#ok-button').outerHTML = editButtonHtml;
            if (document.getElementById('cancel-button')) {
                document.getElementById('cancel-button').remove();
            }
        }
    </script>
    <script>
        function add_new_course(userId) {
            fetch('/course/new/' + userId, {
                method: 'GET',
                headers: {
                    'Content-Type': 'application/json',
                }
            }).then(response => {
                if (!response.ok) {
                    throw new Error('Network response was not ok');
                }

                window.location.href = '/course/new/' + userId;
            });

        }
    </script>
    <script>
        function applyRatingColors() {
            document.querySelectorAll('.rating').forEach(span => {
                const rating = parseFloat(span.dataset.rating);
                const normalized = rating / 10;
                const red = Math.round((1 - normalized) * 255);
                const green = Math.round(normalized * 255);
                const color = `rgb(${red}, ${green}, 0)`;
                span.style.color = color;
                span.style.border = `2px solid ${color}`;
            });
        }

        // Ensure DOM is loaded before calling the function
        document.addEventListener('DOMContentLoaded', applyRatingColors);
    </script>
</head>

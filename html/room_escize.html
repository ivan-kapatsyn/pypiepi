<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Office Plan with Additional Rooms and Exit Sign</title>
</head>
<body>
  <svg width="800" height="780" viewBox="0 -40 800 660" style="border:5px solid #000">
    <!-- Main Building Outer Walls -->
    <rect x="1.25%" y="7.58%" width="97.50%" height="106.06%" fill="none" stroke="black" stroke-width="4"/>

    <!-- Vertical Corridors -->
    <rect x="21.88%" y="1.52%" width="2.50%" height="87.88%" fill="#ddd" stroke="black" stroke-width="2"/>
    <rect x="45.00%" y="1.52%" width="10.00%" height="87.88%" fill="#ddd" stroke="black" stroke-width="2"/>
    <rect x="75.63%" y="1.52%" width="2.50%" height="87.88%" fill="#ddd" stroke="black" stroke-width="2"/>

    <!-- Left Wing Offices -->
    <!-- Left Column: Offices 1,3,5,7,9 -->
    <rect x="1.25%" y="1.52%" width="20.63%" height="17.58%" fill="#cceeff" stroke="black" stroke-width="2"/>
    <rect x="1.25%" y="19.09%" width="20.63%" height="17.58%" fill="#cceeff" stroke="black" stroke-width="2"/>
    <rect x="1.25%" y="36.67%" width="20.63%" height="17.58%" fill="#cceeff" stroke="black" stroke-width="2"/>
    <rect x="1.25%" y="54.24%" width="20.63%" height="17.58%" fill="#cceeff" stroke="black" stroke-width="2"/>
    <rect x="1.25%" y="71.82%" width="20.63%" height="17.58%" fill="#cceeff" stroke="black" stroke-width="2"/>

    <!-- Right Column in Left Wing: Offices 2,4,6,8,10 with horizontal corridor between 4 and 6 -->
    <rect x="24.38%" y="1.52%" width="20.63%" height="16.97%" fill="#cceeff" stroke="black" stroke-width="2"/>
    <rect x="24.38%" y="18.49%" width="20.63%" height="16.97%" fill="#cceeff" stroke="black" stroke-width="2"/>
    <rect x="24.38%" y="35.46%" width="20.63%" height="3.03%" fill="#ddd" stroke="black" stroke-width="2"/>
    <rect x="24.38%" y="38.49%" width="20.63%" height="16.97%" fill="#cceeff" stroke="black" stroke-width="2"/>
    <rect x="24.38%" y="55.46%" width="20.63%" height="16.97%" fill="#cceeff" stroke="black" stroke-width="2"/>
    <rect x="24.38%" y="72.42%" width="20.63%" height="16.97%" fill="#cceeff" stroke="black" stroke-width="2"/>

    <!-- Right Wing Offices -->
    <!-- Left Column: Offices 11,13,15,17,19 with horizontal corridor between 13 and 15 -->
    <rect x="55.00%" y="1.52%" width="20.63%" height="16.97%" fill="#cceeff" stroke="black" stroke-width="2"/>
    <rect x="55.00%" y="18.49%" width="20.63%" height="16.97%" fill="#cceeff" stroke="black" stroke-width="2"/>
    <rect x="55.00%" y="35.46%" width="20.63%" height="3.03%" fill="#ddd" stroke="black" stroke-width="2"/>
    <rect x="55.00%" y="38.49%" width="20.63%" height="16.97%" fill="#cceeff" stroke="black" stroke-width="2"/>
    <rect x="55.00%" y="55.46%" width="20.63%" height="16.97%" fill="#cceeff" stroke="black" stroke-width="2"/>
    <rect x="55.00%" y="72.42%" width="20.63%" height="16.97%" fill="#cceeff" stroke="black" stroke-width="2"/>

    <!-- Right Column in Right Wing: Offices 12,14,16,18,20 -->
    <rect x="78.13%" y="1.52%" width="20.63%" height="17.58%" fill="#cceeff" stroke="black" stroke-width="2"/>
    <rect x="78.13%" y="19.09%" width="20.63%" height="17.58%" fill="#cceeff" stroke="black" stroke-width="2"/>
    <rect x="78.13%" y="36.67%" width="20.63%" height="17.58%" fill="#cceeff" stroke="black" stroke-width="2"/>
    <rect x="78.13%" y="54.24%" width="20.63%" height="17.58%" fill="#cceeff" stroke="black" stroke-width="2"/>
    <rect x="78.13%" y="71.82%" width="20.63%" height="17.58%" fill="#cceeff" stroke="black" stroke-width="2"/>

    <!-- Top Additional Rooms -->
    <rect x="1.25%" y="-13.64%" width="28.75%" height="15.15%" fill="#e0ffe0" stroke="black" stroke-width="2"/>
    <rect x="30.00%" y="-13.64%" width="40.00%" height="15.15%" fill="#e0ffe0" stroke="black" stroke-width="2"/>
    <rect x="70.00%" y="-13.64%" width="28.75%" height="15.15%" fill="#e0ffe0" stroke="black" stroke-width="2"/>

    <!-- Bottom Additional Rooms (symmetrical to the upper side rooms, excluding the central room) -->
    <rect x="1.25%" y="89.39%" width="28.75%" height="15.15%" fill="#e0ffe0" stroke="black" stroke-width="2"/>
    <rect x="70.00%" y="89.39%" width="28.75%" height="15.15%" fill="#e0ffe0" stroke="black" stroke-width="2"/>

    <!-- "Exit" Sign at the bottom of the central corridor -->
    <text x="50%" y="94.70%" font-size="16" text-anchor="middle" fill="red">Exit</text>
  </svg>
</body>
</html>

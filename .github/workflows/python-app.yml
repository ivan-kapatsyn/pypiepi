name: Run Unittests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: windows-latest

    steps:
    # Step 1: Checkout the code
    - name: Checkout code
      uses: actions/checkout@v3

    # Step 2: Set up Python environment
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x' # Specify the required Python version

    # Step 3: Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Step 4: Download PostgreSQL
    - name: Download PostgreSQL
      run: |
        choco install postgresql --version=14.0 -y
      shell: cmd

    # Step 5: Initialise db
    - name: Initialize PostgreSQL Database
      run: |
        set "PATH=C:\Program Files\PostgreSQL\14\bin;%PATH%"
        pg_ctl initdb -D C:\pgdata
        pg_ctl start -D C:\pgdata -l logfile
        psql -c "CREATE DATABASE postgres;" -U postgres
        psql -c "CREATE USER postgres WITH PASSWORD 'postgres';" -U postgres

    # Step 6: Read all the .env variabes from test.env
    - name: Load test.env variables
      run: |
        python -c "from dotenv import load_dotenv; load_dotenv(dotenv_path='test.env')"
    
    # Step 7: Reset .env variabes that contain credentials
    - name: Set environment variables
      run: |
        echo PROJECT_PATH=${{ github.workspace }} >> $GITHUB_ENV
        echo PASSWORD="postgres" >> $GITHUB_ENV

    # Step 8: Run unittest for all test folders
    - name: Run unittests
      run: |
        python -m unittest discover -s test/backend -p "*.py"
        python -m unittest discover -s test/ui -p "*.py"
        python -m unittest discover -s test/util -p "*.py"

name: Run Unittests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: windows-latest

    steps:
    # Step 1: Checkout the code
    - name: Checkout code
      uses: actions/checkout@v3

    # Step 2: Set up Python environment
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x' # Specify the required Python version

    # Step 3: Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Step 4: Run unittest for all test folders
    - name: Run unittests
      run: |
        python -m unittest discover -s test/backend -p "*.py"
        python -m unittest discover -s test/ui -p "*.py"
        python -m unittest discover -s test/util -p "*.py"

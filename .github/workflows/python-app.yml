name: Run Unittests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 12345
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
    # Step 1: Checkout the code
    - name: Checkout code
      uses: actions/checkout@v3

    # Step 2: Set up Python environment
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12' # Specify the required Python version

    # Step 3: Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Step 4: Read all the .env variabes from test.env
    - name: Load environment variables from test.env
      run: |
        export $(grep -v '^#' test.env | xargs)
        echo "GIT_ENV=$(grep -v '^#' test.env | xargs)" >> $GITHUB_ENV
    
    # Step 5: Reset .env variabes that contain credentials
    - name: Set environment variables
      run: |
        echo "PROJECT_PATH=${{ github.workspace }}" >> $GITHUB_ENV
        echo "PASSWORD=12345" >> $GITHUB_ENV

    # Step 6: Run tables initialisation
    - name: Tables initialisation
      run: |
        python -m scripts.initialize_db

    # Step 7: Run unittest for all test folders
    - name: Run Backend unittests
      run: |
        python -m unittest discover -s tests/backend -p "*.py"
      continue-on-error: true
      id: test1

    - name: Run UI unittests
      run: |
        python -m unittest discover -s tests/ui -p "*.py"
      continue-on-error: true
      id: test2

    - name: Run Utils unittests
      run: |
        python -m unittest discover -s tests/utils -p "*.py"
      continue-on-error: true
      id: test3

    - name: Fail if any tests failed
      run: |
        if [ "${{ steps.test1.outcome }}" != "success" ] || [ "${{ steps.test2.outcome }}" != "success" ] || [ "${{ steps.test3.outcome }}" != "success" ]; then
          echo "One or more tests failed. Marking run as failed."
          exit 1
        fi
        
        

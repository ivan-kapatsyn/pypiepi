name: Run Unittests

on:
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: windows-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
    # Step 1: Checkout the code
    - name: Checkout code
      uses: actions/checkout@v3

    # Step 2: Set up Python environment
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x' # Specify the required Python version

    # Step 3: Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    # Step 4: Read all the .env variabes from test.env
    - name: Load test.env variables
      run: |
        python -c "from dotenv import load_dotenv; load_dotenv(dotenv_path='test.env')"
    
    # Step 5: Reset .env variabes that contain credentials
    - name: Set environment variables
      run: |
        echo PROJECT_PATH=${{ github.workspace }} >> $GITHUB_ENV
        echo PASSWORD="postgres" >> $GITHUB_ENV
        

    # Step 6: Run unittest for all test folders
    - name: Run unittests
      run: |
        python -m unittest discover -s test/backend -p "*.py"
        python -m unittest discover -s test/ui -p "*.py"
        python -m unittest discover -s test/util -p "*.py"
